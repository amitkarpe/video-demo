<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No NAT. Still S3. — Round 2</title>
<style>body{margin:0;background:#f1efe6;color:#172d35;font:18px Arial,sans-serif}main{max-width:1400px;margin:32px auto;padding:0 24px}h1{font-size:32px}video{width:100%;background:#172d35;border-radius:12px}button{background:#086c71;color:white;border:0;border-radius:8px;padding:14px 24px;font-size:18px;cursor:pointer}output{margin-left:24px}p{color:#51676b}</style>
<main><h1>No NAT. Still S3.</h1><video id="film" controls preload="metadata" src="pilot.mp4"></video><p><button id="play">Play from start</button><output id="status" role="status">Loading metadata</output></p><p>Illustrative AWS routing animation. AI-generated narration. Captions are included in the picture.</p></main>
<script>const v=document.querySelector('#film'),o=document.querySelector('#status');const time=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');function state(){o.textContent=time(v.currentTime)+' / '+time(v.duration||0)+' · '+(v.ended?'Ended':v.paused?'Paused':'Playing')}for(const e of ['loadedmetadata','timeupdate','play','pause','ended'])v.addEventListener(e,state);document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};v.addEventListener('error',()=>o.textContent='Playback error: '+v.error?.code);</script></html>
